<script>
// ===================== тайминги озвучки (секунды) =====================
const T = {
  q: 2.22,
  s2: 3.74, self: 7.84, c1: 9.86, c2: 11.42, c3: 13.0, c4: 14.4, c5: 15.88, fit: 16.3,

  s9: 68.9, q1: 71.34, q2: 72.28, q3: 73.26, week: 74.2, rebuild2: 76.14,
  s10: 78.26, dcl: 80.14, wb: 81.08,
  s11: 82.9, unhappy: 84.16, design: 85.16, life: 86.3,
  fin: 88.9, END: 92.5,
};

// ===================== помощники =====================
const C_ = { ink: '#1c2220', muted: '#56605b', paper: '#f6f4ef', card: '#fbfaf6', line: '#e3dfd6', floor: '#ece8df',
  one: '#0f7a4a', oneSoft: '#dcefe5', zero: '#e5824f', zeroInk: '#a4461b', zeroSoft: '#fbe5d8', shirt: '#2f6f8f', dress: '#d8679a', hairW: '#4a2c22' };
const NS = 'http://www.w3.org/2000/svg';
const SVG = document.getElementById('svg');
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', { x, y, ...attrs }, parent); t.textContent = s; return t; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const inn = (t, a, d = 0.45) => ease((t - a) / d);
const vis = (t, a, b = 1e9, fi = 0.45, fo = 0.35) => Math.min(inn(t, a, fi), 1 - ease((t - b) / fo));
const lerp = (a, b, k) => a + (b - a) * k;
function setOp(e, o) { e.setAttribute('opacity', o.toFixed(3)); e.style.display = o < 0.003 ? 'none' : ''; }
/** появление: прозрачность + подъём + «пружинка» масштаба вокруг (cx, cy) */
function pop(e, t, a, cx, cy, { b = 1e9, dy = 0, spring = true, d = 0.5 } = {}) {
  const o = vis(t, a, b, d);
  const p = spring ? back((t - a) / (d + 0.1)) : inn(t, a, d);
  const s = spring ? 0.4 + 0.6 * p : 1;
  const y = (1 - inn(t, a, d)) * dy;
  e.setAttribute('transform', `translate(${cx} ${cy + y}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`);
  setOp(e, o);
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))); return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join(''); }

// аксонометрия (оси D, C, L не сливают углы 000 и 111)
const EX = [Math.cos(14 * Math.PI / 180), Math.sin(14 * Math.PI / 180)];
const EY = [-Math.cos(58 * Math.PI / 180), Math.sin(58 * Math.PI / 180)];
const EZ = [0, -0.78];
function proj(O, S) {
  const P = (x, y, z) => [O[0] + (x * EX[0] + y * EY[0] + z * EZ[0]) * S, O[1] + (x * EX[1] + y * EY[1] + z * EZ[1]) * S];
  const pts = (arr) => arr.map((p) => P(...p).map((v) => v.toFixed(1)).join(',')).join(' ');
  return { P, pts, S };
}
function box(g, pr, x, y, z, w, d, h, color) {
  el('polygon', { points: pr.pts([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]]), fill: shade(color, -0.12) }, g);
  el('polygon', { points: pr.pts([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]]), fill: shade(color, -0.28) }, g);
  el('polygon', { points: pr.pts([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]]), fill: shade(color, 0.18) }, g);
}
function person(g, pr, x, y, k, shirt = C_.shirt, hair = '#2b2f33') {
  const u = 0.06 * k;
  const c = pr.P(x + u, y + u, 0);
  el('ellipse', { cx: c[0], cy: c[1], rx: 0.3 * pr.S * k * 0.42, ry: 0.11 * pr.S * k * 0.42, fill: C_.ink, opacity: 0.12 }, g);
  box(g, pr, x, y + u * 0.2, 0, u * 0.7, u * 0.8, u * 3.2, '#3a4550');
  box(g, pr, x + u * 1.1, y + u * 0.2, 0, u * 0.7, u * 0.8, u * 3.2, '#3a4550');
  box(g, pr, x - u * 0.2, y, u * 3.2, u * 2.2, u * 1.2, u * 3.2, shirt);
  box(g, pr, x - u * 0.75, y + u * 0.25, u * 3.6, u * 0.55, u * 0.7, u * 2.6, shirt);
  box(g, pr, x + u * 2.0, y + u * 0.25, u * 3.6, u * 0.55, u * 0.7, u * 2.6, shirt);
  box(g, pr, x + u * 0.25, y + u * 0.1, u * 6.5, u * 1.3, u * 1.1, u * 1.4, '#e7c6a5');
  box(g, pr, x + u * 0.15, y + u * 0.05, u * 7.6, u * 1.5, u * 1.2, u * 0.4, hair);
  return pr.P(x + u, y + u, u * 9.5); // точка над головой
}
// Женщина: платье, юбка, длинные волосы, спадающие на плечи
function woman(g, pr, x, y, k, dress = C_.dress, hair = C_.hairW) {
  const u = 0.06 * k;
  const c = pr.P(x + u, y + u, 0);
  el('ellipse', { cx: c[0], cy: c[1], rx: 0.3 * pr.S * k * 0.42, ry: 0.11 * pr.S * k * 0.42, fill: C_.ink, opacity: 0.12 }, g);
  box(g, pr, x + u * 0.15, y + u * 0.3, 0, u * 0.55, u * 0.6, u * 2.2, '#3a4550');
  box(g, pr, x + u * 1.15, y + u * 0.3, 0, u * 0.55, u * 0.6, u * 2.2, '#3a4550');
  box(g, pr, x - u * 0.35, y - u * 0.1, u * 1.9, u * 2.5, u * 1.4, u * 1.5, shade(dress, -0.1));
  box(g, pr, x - u * 0.1, y + u * 0.05, u * 3.2, u * 2.0, u * 1.1, u * 3.2, dress);
  box(g, pr, x - u * 0.6, y + u * 0.3, u * 3.6, u * 0.5, u * 0.6, u * 2.6, dress);
  box(g, pr, x + u * 1.9, y + u * 0.3, u * 3.6, u * 0.5, u * 0.6, u * 2.6, dress);
  const strand = (sx) => {
    box(g, pr, sx, y + u * 1.12, u * 4.9, u * 0.25, u * 0.23, u * 1.5, hair);
    box(g, pr, sx, y + u * 0.05, u * 6.4, u * 0.25, u * 1.3, u * 1.45, hair);
  };
  strand(x);
  box(g, pr, x + u * 0.25, y + u * 0.1, u * 6.5, u * 1.3, u * 1.1, u * 1.4, '#e7c6a5');
  strand(x + u * 1.55);
  box(g, pr, x, y - u * 0.05, u * 7.7, u * 1.8, u * 1.4, u * 0.5, hair);
  return pr.P(x + u, y + u, u * 9.5);
}
function codeText(g, x, y, code, size = 44, anchor = 'middle') {
  const t = el('text', { x, y, 'font-size': size, 'font-weight': 800, class: 'mono', 'text-anchor': anchor }, g);
  for (const ch of code) { const s = el('tspan', { fill: ch === '0' ? C_.zeroInk : ch === 'x' ? '#8a9096' : C_.one }, t); s.textContent = ch; }
  return t;
}
function badgeCode(g, cx, cy, code, full) {
  const b = el('g', {}, g);
  const w = code.length * 32 + 34;
  if (full) el('circle', { cx, cy, r: 72, fill: C_.one, opacity: 0.15 }, b);
  el('rect', { x: cx - w / 2, y: cy - 31, width: w, height: 62, rx: 20, fill: full ? C_.one : C_.card, stroke: full ? 'none' : C_.line, 'stroke-width': 3 }, b);
  if (full) txt(b, cx, cy + 15, code, { 'font-size': 42, 'font-weight': 800, class: 'mono', 'text-anchor': 'middle', fill: '#f3f1ea' });
  else codeText(b, cx, cy + 15, code, 42);
  return b;
}
function grade(g, cx, cy, n, color, r = 70) {
  const b = el('g', {}, g);
  el('circle', { cx, cy, r, fill: C_.card, stroke: color, 'stroke-width': 8 }, b);
  txt(b, cx, cy + r * 0.38, String(n), { 'font-size': r * 1.12, 'font-weight': 800, fill: color, 'text-anchor': 'middle' });
  return b;
}
function bubble(g, x, y, w, lines, tail = 'left', fill = C_.card, color = C_.ink, size = 34) {
  const b = el('g', {}, g);
  const h = lines.length * size * 1.3 + 40;
  const tx = tail === 'left' ? x + 50 : x + w - 50;
  el('path', { d: `M ${tx - 18} ${y + h - 2} L ${tx + (tail === 'left' ? -30 : 30)} ${y + h + 40} L ${tx + 22} ${y + h - 2} Z`, fill, stroke: C_.line, 'stroke-width': 3 }, b);
  el('rect', { x, y, width: w, height: h, rx: 26, fill, stroke: C_.line, 'stroke-width': 3 }, b);
  el('rect', { x: tx - 16, y: y + h - 6, width: 36, height: 8, fill }, b);
  lines.forEach((l, i) => txt(b, x + 26, y + 20 + size * 1.05 + i * size * 1.3, l, { 'font-size': size, 'font-weight': 700, fill: color }));
  return b;
}
function pill(g, cx, cy, label, fill, color, size = 28) {
  const b = el('g', {}, g);
  const w = label.length * size * 0.58 + 40;
  el('rect', { x: cx - w / 2, y: cy - size, width: w, height: size * 2, rx: size, fill }, b);
  txt(b, cx, cy + size * 0.36, label, { 'font-size': size, 'font-weight': 700, fill: color, 'text-anchor': 'middle' });
  return b;
}
function seeded(seed) { let a = seed; return () => (a = (a * 9301 + 49297) % 233280) / 233280; }

// ---------- куб DCL ----------
function buildCube(g, O = [470, 930], S = 360) {
  const pr = proj(O, S);
  const parts = { pr };
  el('polygon', { points: pr.pts([[-0.35, -0.35, 0], [1.6, -0.35, 0], [1.6, 1.6, 0], [-0.35, 1.6, 0]]), fill: C_.floor }, g);
  const V = []; for (const x of [0, 1]) for (const y of [0, 1]) for (const z of [0, 1]) V.push([x, y, z]);
  const edges = el('g', {}, g);
  const backV = (v) => v[0] === 0 && v[1] === 0;
  for (const a of V) for (const b of V) {
    const d = a.reduce((s, v, i) => s + Math.abs(v - b[i]), 0);
    if (d === 1 && a.join() < b.join()) { const A = pr.P(...a), B = pr.P(...b); const dashed = (backV(a) && backV(b)) || (a[2] === 0 && b[2] === 0 && (backV(a) || backV(b)));
      el('line', { x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: '#9aa39e', 'stroke-width': dashed ? 3 : 5, 'stroke-dasharray': dashed ? '12 12' : 'none', 'stroke-linecap': 'round' }, edges); }
  }
  parts.edges = edges;
  parts.glow = el('circle', { cx: pr.P(1, 1, 1)[0], cy: pr.P(1, 1, 1)[1], r: 150, fill: C_.one, opacity: 0.1 }, g);
  parts.axes = [[1.3, 0, 0, 'D', 'хочу', 14, 10], [0, 1.3, 0, 'C', 'согласен', -30, 50], [0, 0, 1.25, 'L', 'можно', 18, -10]].map(([x, y, z, L, sub, dx, dy]) => {
    const a = pr.P(0, 0, 0), b = pr.P(x, y, z);
    const ax = el('g', {}, g);
    const line = el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C_.one, 'stroke-width': 7, 'stroke-linecap': 'round' }, ax);
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]); line.setAttribute('stroke-dasharray', `${len} ${len}`);
    const lab = el('g', {}, ax);
    txt(lab, b[0] + dx, b[1] + dy, L, { 'font-size': 52, 'font-weight': 800, fill: C_.one, class: 'mono' });
    txt(lab, b[0] + dx, b[1] + dy + 38, sub, { 'font-size': 30, fill: C_.muted });
    return { ax, line, len, lab };
  });
  const OFF = { '000': [-95, 20], '100': [40, 80], '010': [-95, 30], '110': [70, 60], '001': [-95, -20], '101': [95, -30], '011': [-100, -10], '111': [95, -10] };
  parts.corner = {};
  parts.badges = V.map((v) => { const code = v.join(''); const p = pr.P(...v); const o = OFF[code]; parts.corner[code] = p; return { code, b: badgeCode(g, p[0] + o[0], p[1] + o[1], code, code === '111'), x: p[0] + o[0], y: p[1] + o[1] }; });
  parts.dots = el('g', {}, g);
  return parts;
}
// облака точек недели: [код, число точек, радиус, цвет]
const CLOUD = [['011', 22, 95, C_.zero], ['101', 13, 70, C_.zero], ['001', 5, 45, C_.zero], ['111', 9, 60, C_.one]];
function makeDots(parts, seed) {
  const R = seeded(seed); const dots = [];
  CLOUD.forEach(([code, n, r, color]) => { const c = parts.corner[code]; for (let i = 0; i < n; i++) { const a = R() * Math.PI * 2, rr = Math.sqrt(R()) * r;
    const d = el('circle', { r: (9 + R() * 5).toFixed(1), fill: color, opacity: 0.88 }, parts.dots);
    dots.push({ d, code, x: c[0] + Math.cos(a) * rr, y: c[1] + Math.sin(a) * rr * 0.7, delay: R(), color }); } });
  return dots;
}

// ===================== помощники ролика 3 =====================
const DEFS = el('defs', {}, SVG);
let FID = 0;
/** обесцвечивание группы: возвращает функцию k ∈ [0, 1] → насколько серым */
function grayer(g) {
  const id = 'gf' + (FID++);
  const f = el('filter', { id, x: '-20%', y: '-20%', width: '140%', height: '140%', 'color-interpolation-filters': 'sRGB' }, DEFS);
  const m = el('feColorMatrix', { type: 'saturate', values: '1' }, f);
  g.setAttribute('filter', `url(#${id})`);
  return (k) => m.setAttribute('values', (1 - clamp(k)).toFixed(3));
}
function wrenchIcon(g) { return el('path', { d: 'M 0 0 l 120 -120 a 40 40 0 1 1 40 40 l -120 120 z M 132 -132 l 24 24', fill: '#7a8288', stroke: '#5b6368', 'stroke-width': 6 }, g); }
const BW = 0.3, BH = 0.34, BD = 0.3; // блок стены «система»
/** стена из блоков; порядок отрисовки — по колонке, затем по ряду */
function wall(g, pr, cells, color = '#c9cfcb', onColor = null) {
  return cells.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(([c, r]) => {
    const w = el('g', {}, g);
    const off = el('g', {}, w); box(off, pr, c * BW, 0, r * BH, BW - 0.02, BD, BH - 0.02, color);
    let on = null; if (onColor) { on = el('g', {}, w); box(on, pr, c * BW, 0, r * BH, BW - 0.02, BD, BH - 0.02, onColor); setOp(on, 0); }
    return { c, r, w, off, on, p: pr.P(c * BW + BW / 2, BD / 2, r * BH + BH / 2) };
  });
}
function wallCells(skip = []) { const out = []; for (let c = 0; c < 6; c++) for (let r = 0; r < 3; r++) if (!skip.some(([a, b]) => a === c && b === r)) out.push([c, r]); return out; }
const SLOT = [[2, 0], [2, 1]];
function floorPoly(g, pr, x0, y0, x1, y1) { return el('polygon', { points: pr.pts([[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]]), fill: C_.floor }, g); }
function pillL(g, x, cy, label, fill, color, size = 28) { const w = label.length * size * 0.58 + 40; return [pill(g, x + w / 2, cy, label, fill, color, size), x + w / 2]; }
function miniBadge(g, cx, cy, code) {
  const b = el('g', {}, g);
  el('rect', { x: cx - 50, y: cy - 24, width: 100, height: 48, rx: 16, fill: C_.card, stroke: C_.line, 'stroke-width': 3 }, b);
  codeText(b, cx, cy + 11, code, 32);
  return b;
}
const cssT = (e, x, y, sx = 1, sy = sx, ox = 0, oy = 0) => e.setAttribute('transform', `translate(${(ox + x).toFixed(1)} ${(oy + y).toFixed(1)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(${(-ox).toFixed(1)} ${(-oy).toFixed(1)})`);
/** «Жизнь на пятёрку» из ролика 2: площадка, пара, ноутбук, монеты, чемодан, солнце */
function lifeScene(g, pr, sun) {
  box(g, pr, 0, 0, -0.1, 1.5, 1.5, 0.1, '#e3ddd0');
  box(g, pr, 0.06, 0.62, 0, 0.34, 0.24, 0.02, '#4a5560');
  el('polygon', { points: pr.pts([[0.06, 0.62, 0.02], [0.4, 0.62, 0.02], [0.4, 0.62, 0.26], [0.06, 0.62, 0.26]]), fill: '#2f3a44' }, g);
  const lc = pr.P(0.23, 0.62, 0.14);
  el('path', { d: `M ${lc[0]} ${lc[1] + 18} c -40 -26 -30 -58 0 -40 c 30 -18 40 14 0 40 z`, fill: C_.zero }, g);
  const h2 = woman(g, pr, 1.12, 0.22, 2.0);
  el('path', { d: `M ${h2[0] - 70} ${h2[1] - 20} c -30 -22 -24 -48 0 -32 c 24 -16 30 12 0 32 z`, fill: C_.zero }, g);
  const head = person(g, pr, 0.74, 0.6, 2.3, C_.shirt);
  for (let i = 0; i < 5; i++) { const c = pr.P(0.2, 1.25, 0.03 * i); el('ellipse', { cx: c[0], cy: c[1], rx: 46, ry: 20, fill: '#d9a62e', stroke: '#b9871a', 'stroke-width': 3 }, g); }
  const cc = pr.P(0.2, 1.25, 0.15); txt(g, cc[0], cc[1] - 6, '₽', { 'font-size': 40, 'font-weight': 800, fill: '#8a6110', 'text-anchor': 'middle' });
  box(g, pr, 1.1, 1.1, 0, 0.26, 0.14, 0.3, '#3f7f9f');
  const hb = pr.P(1.23, 1.17, 0.3);
  el('path', { d: `M ${hb[0] - 22} ${hb[1]} v -22 h 44 v 22`, stroke: '#2a5a72', 'stroke-width': 8, fill: 'none' }, g);
  el('circle', { cx: sun[0], cy: sun[1], r: 62, fill: '#f2c14e' }, g);
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; el('line', { x1: sun[0] + Math.cos(a) * 82, y1: sun[1] + Math.sin(a) * 82, x2: sun[0] + Math.cos(a) * 112, y2: sun[1] + Math.sin(a) * 112, stroke: '#f2c14e', 'stroke-width': 10, 'stroke-linecap': 'round' }, g); }
  grade(g, head[0] - 10, head[1] - 80, 5, C_.one, 58);
}
/** контурная копия группы — «чертёж»: линии рисуются через stroke-dashoffset */
function blueprint(src, parent, color = '#3b74b8') {
  const c = src.cloneNode(true); parent.appendChild(c);
  c.querySelectorAll('text').forEach((e) => e.remove());
  const shapes = [];
  c.querySelectorAll('polygon,path,circle,ellipse,line,rect').forEach((e) => {
    e.setAttribute('fill', 'none'); e.setAttribute('stroke', color); e.setAttribute('stroke-width', 2.6); e.setAttribute('stroke-linejoin', 'round'); e.removeAttribute('opacity');
    const len = Math.max(1, e.getTotalLength());
    e.setAttribute('stroke-dasharray', `${len.toFixed(1)} ${len.toFixed(1)}`);
    shapes.push([e, len]);
  });
  return { c, shapes };
}

scene(38.8, 49.8, 'Вершина —<br><span class="g">для немногих</span>', (g) => {
  const S = 260, pr = proj([415, 620], S);
  const N = 5, IN = 0.22, H = 0.2, B = 2.2;
  const R = seeded(11);
  const counts = [34, 16, 7, 3];
  const levels = [], dots = [];
  for (let i = 0; i < N; i++) {
    const lg = el('g', {}, g);
    const x0 = IN * i, s = B - 2 * IN * i;
    box(lg, pr, x0, x0, H * i, s, s, H, i === N - 1 ? '#e6c35c' : shade('#e3ddd0', -0.035 * i));
    levels.push([lg, pr.P(B / 2, B / 2, H * i)]);
    if (i < N - 1) {
      const dg = el('g', {}, g); let k = 0, guard = 0;
      const ix = IN * (i + 1), is = B - 2 * IN * (i + 1);
      while (k < counts[i] && guard++ < 4000) {
        const x = x0 + 0.05 + R() * (s - 0.1), y = x0 + 0.05 + R() * (s - 0.1);
        if (x > ix - 0.06 && x < ix + is + 0.06 && y > ix - 0.06 && y < ix + is + 0.06) continue;
        const p = pr.P(x, y, H * (i + 1));
        dots.push({ d: el('circle', { cx: p[0], cy: p[1], r: 10, fill: '#6f8794' }, dg), p, lvl: i, ph: R() * 6.28, front: x + y > B * 1.15 });
        k++;
      }
      levels[i].push(dg);
    }
  }
  const climbers = dots.filter((d) => d.lvl === 0 && d.front).slice(0, 6);
  const top = el('g', {}, g);
  climbers.forEach((d) => top.appendChild(d.d));
  const u = 0.06 * 1.4;
  const hero = el('g', {}, g); const hz = el('g', { transform: `translate(0 ${(-H * N * 0.78 * S).toFixed(1)})` }, hero);
  const head = person(hz, pr, B / 2 - 0.9 * u, B / 2 - 0.6 * u, 1.4, '#2f6f8f');
  const headY = head[1] - H * N * 0.78 * S;
  const coin = el('g', {}, g);
  el('circle', { cx: head[0] + 70, cy: headY - 30, r: 34, fill: '#e6c35c', stroke: '#b9871a', 'stroke-width': 4 }, coin);
  txt(coin, head[0] + 70, headY - 17, '₽', { 'font-size': 36, 'font-weight': 800, fill: '#8a6110', 'text-anchor': 'middle' });
  const tagS = pill(g, head[0] - 70, headY - 70, 'успех', C_.card, C_.ink, 28);
  const cx = pr.P(B / 2, B / 2, H)[0];
  return (t) => {
    levels.forEach(([lg, c, dg], i) => { pop(lg, t, T.econ - 0.3 + i * 0.15, c[0], c[1], { dy: 30, spring: false }); if (dg) setOp(dg, inn(t, T.notall - 0.2 + i * 0.25, 0.5)); });
    pop(hero, t, T.success - 0.1, head[0], head[1], { dy: -30, spring: false });
    pop(coin, t, T.success + 0.2, head[0] + 70, headY - 30);
    pop(tagS, t, T.success, head[0] - 70, headY - 70);
    const jit = 4 * inn(t, T.compet, 0.5);
    dots.forEach((d, i) => {
      let x = d.p[0] + Math.sin(t * 7 + d.ph) * jit, y = d.p[1] + Math.cos(t * 6 + d.ph) * jit * 0.5;
      const j = climbers.indexOf(d);
      if (j >= 0) {
        const up = inn(t, T.chance + j * 0.3, 0.5) - inn(t, T.small + j * 0.12, 0.35);
        x += (cx - d.p[0]) * 0.16 * up; y -= 62 * up;
      }
      d.d.setAttribute('cx', x.toFixed(1)); d.d.setAttribute('cy', y.toFixed(1));
      if (j >= 0) setOp(d.d, inn(t, T.notall - 0.2, 0.5));
    });
  };
});

// ===================== субтитры =====================
const FIX = { '–': '—', 'кажется,': 'кажется:' };
let CHUNKS = [], lastCap = null;
function buildCaptions(segments) {
  const words = [];
  for (const s of segments) for (const w of s.words) {
    const txt0 = FIX[w.w] || w.w;
    const prev = words[words.length - 1];
    if (prev && /^-/.test(txt0)) { prev.w += txt0; prev.e = w.e; continue; }
    if (prev && prev.w === 'за' && txt0 === 'меров') { prev.w = 'замеров —'; prev.e = w.e; continue; }
    words.push({ w: txt0, s: w.s, e: w.e });
  }
  let cur = [];
  const flush = () => { if (cur.length) CHUNKS.push(cur); cur = []; };
  for (const w of words) { cur.push(w); const len = cur.map((x) => x.w).join(' ').length; if (/[.?!]$/.test(w.w) || (/[,:]$/.test(w.w) && len > 18) || len > 30) flush(); }
  flush();
}
function renderCaption(t) {
  let chunk = null;
  for (let i = 0; i < CHUNKS.length; i++) { const c = CHUNKS[i], n = CHUNKS[i + 1]; const end = Math.min(c[c.length - 1].e + 0.6, n ? n[0].s - 0.05 : 1e9); if (t >= c[0].s - 0.15 && t < end) { chunk = c; break; } }
  const cap = document.getElementById('cap');
  if (!chunk) { cap.style.opacity = 0; return; }
  if (lastCap !== chunk) { cap.innerHTML = chunk.map((w) => `<span>${w.w}</span> `).join(''); lastCap = chunk; }
  cap.style.opacity = 1;
  const spans = cap.querySelectorAll('span');
  chunk.forEach((w, i) => { spans[i].className = t >= w.s ? (t < w.e + 0.05 ? 'on cur' : 'on') : ''; });
}

// ===================== кадр =====================
function render(t) {
  for (const sc of SCENES) {
    const v = vis(t, sc.t0, sc.t1 - 0.3, 0.35, 0.3);
    setOp(sc.g, v);
    sc.tEl.style.opacity = v.toFixed(3);
    sc.tEl.style.transform = `translateY(${((1 - inn(t, sc.t0, 0.45)) * 30).toFixed(1)}px)`;
    sc.tEl.style.display = v < 0.003 ? 'none' : '';
    if (v > 0.003) sc.update(t);
  }
  const hide = Math.max(vis(t, T.s10 - 0.3, 82.5, 0.3, 0.3), inn(t, T.fin - 0.2, 0.3));
  document.getElementById('brand').style.opacity = (1 - hide).toFixed(3);
  renderCaption(t);
}
window.render = render;
window.setWords = (segments) => { CHUNKS = []; lastCap = null; buildCaptions(segments); };
window.TIMES = T;
(async () => {
  const p = new URLSearchParams(location.search);
  if (!window.__RENDERER__) {
    try { window.setWords(await (await fetch('assets/words.json')).json()); } catch (e) { console.warn(e); }
    render(Number(p.get('t') || 0));
  }
})();
